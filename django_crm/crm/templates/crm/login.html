<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sidekick CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --bg: #090b11;
            --card-bg: rgba(17, 24, 39, 0.6);
            --card-border: rgba(255, 255, 255, 0.07);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #f43f5e;
            --sky: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 56px 48px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            backdrop-filter: blur(25px);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(124, 58, 237, 0.05);
            text-align: center;
            transition: all 0.3s;
        }

        .login-container:hover {
            border-color: rgba(124, 58, 237, 0.25);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(124, 58, 237, 0.1);
        }

        .logo-header i {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary), var(--sky));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(124, 58, 237, 0.4));
            margin-bottom: 16px;
        }

        .logo-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .logo-header p {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            color: var(--sky);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 40px;
        }

        input {
            background: rgba(10, 11, 18, 0.6) !important;
            border: 1px solid var(--card-border) !important;
            color: #ffffff !important;
            border-radius: 14px !important;
            padding: 16px 20px !important;
            width: 100%;
            margin-bottom: 24px;
            font-family: inherit;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.25) !important;
            background: rgba(10, 11, 18, 0.8) !important;
        }

        button {
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            width: 100%;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .messages {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: #fb7185;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            font-weight: 600;
            list-style: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-header">
            <i class="fa-solid fa-handshake"></i>
            <h1>Sidekick CRM</h1>
            <p>ENTERPRISE SUITE</p>
        </div>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username (admin)" required autofocus>
            <input type="password" name="password" placeholder="Password (admin123)" required>
            <button type="submit">Sign In &nbsp; →</button>
        </form>
    </div>

</body>
</html>
