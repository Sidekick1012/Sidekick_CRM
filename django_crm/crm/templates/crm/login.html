<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sidekick CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --border: rgba(99, 102, 241, 0.2);
            --text: #f1f5f9;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo-header i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .logo-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .logo-header p {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 14px 18px;
            width: 100%;
            margin-bottom: 20px;
            font-family: inherit;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s;
            text-align: left;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--primary-light);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
        }

        .messages {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            list-style: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-header">
            <i class="fa-solid fa-handshake"></i>
            <h1>Sidekick CRM</h1>
            <p>ENTERPRISE SUITE</p>
        </div>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username (admin)" required autofocus>
            <input type="password" name="password" placeholder="Password (admin123)" required>
            <button type="submit">Sign In &nbsp; →</button>
        </form>
    </div>

</body>
</html>
